<!-- The defer attribute in HTML is used to specify that a script should be executed after the document has been parsed. This means that the script will not block the parsing of the HTML document, allowing the page to load faster. The script will be executed in the order they appear in the document, but only after the entire document has been parsed. -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Defer Example</title>
    <script src="script1.js" defer></script>
    <script src="script2.js" defer></script>
  </head>
  <body>
    <h1>Hello, World!</h1>
  </body>
</html>
